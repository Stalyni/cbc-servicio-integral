<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de filtros CBC Servicio Integral SpA">
  <title>Catálogo de Filtros | CBC Servicio Integral SpA</title>
  <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Volver al inicio">
      <img src="../img/cbc_servicio_integral.svg" alt="CBC Servicio Integral SpA">
    </a>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="main-nav">
      <a href="../index.html">Inicio</a>
      <a class="active" href="catalogo.html">Catálogo</a>
      <a href="repuestos.html">Repuestos</a>
      
      
      
      <a class="quote-link" href="mailto:cbc.serviciointegral@gmail.com" rel="noopener">Cotizar</a>
    </nav>
  </header>

  <section class="catalog-hero">
    <div>
      <span class="eyebrow">CBC SERVICIO INTEGRAL SpA</span>
      <h1>CATÁLOGO DE FILTROS</h1>
      <p>Encuentra filtros para compresores, generadores, torres de iluminación y equipos industriales.</p>
    </div>
  </section>

  <main class="catalog-layout">
    <aside class="filters-panel">
      <div class="filters-heading">
        <h2>Filtros</h2>
        <button id="clearFilters" type="button">Limpiar</button>
      </div>

      <label class="search-box">
        <span>Buscar producto</span>
        <input id="searchInput" type="search" placeholder="Código, marca o equipo">
      </label>

      <section class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">Categoría <span>−</span></button>
        <div id="categoryFilters" class="filter-options"></div>
      </section>

      <section class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">Aplicación <span>−</span></button>
        <div id="subcategoryFilters" class="filter-options"></div>
      </section>

      <section class="filter-group">
        <button class="filter-title" type="button" aria-expanded="true">Marca <span>−</span></button>
        <div id="brandFilters" class="filter-options"></div>
      </section>
    </aside>

    <section class="products-area">
      <div class="catalog-toolbar">
        <div>
          <h2>Filtros</h2>
          <p id="resultCount">Cargando productos...</p>
        </div>
        <label class="sort-control">
          <span>Ordenar por</span>
          <select id="sortSelect">
            <option value="featured">Destacados</option>
            <option value="name-asc">Nombre A–Z</option>
            <option value="price-asc">Precio menor</option>
            <option value="price-desc">Precio mayor</option>
          </select>
        </label>
      </div>

      <div id="productGrid" class="product-grid" aria-live="polite"></div>
      <nav id="pagination" class="pagination" aria-label="Paginación del catálogo"></nav>
    </section>
  </main>

  <template id="productTemplate">
    <article class="product-card">
      <div class="product-image-wrap">
        <span class="badge badge-stock">Disponible</span>
        <img class="product-image" alt="" loading="lazy">
      </div>
      <div class="product-content">
        <p class="product-meta"><span class="product-code"></span><span class="separator">|</span><span class="product-brand"></span></p>
        <h3 class="product-name"></h3>
        <p class="product-application"></p>
        <div class="price-row">
          <strong class="current-price"></strong>
          <del class="old-price"></del>
        </div>
        <div class="product-actions">
          <a class="detail-button" target="_blank" rel="noopener">Ver ficha</a>
          <a class="quote-button" target="_blank" rel="noopener">Cotizar</a>
        </div>
      </div>
    </article>
  </template>

  <footer class="catalog-footer">
    <img src="../img/cbc_servicio_integral.svg" alt="CBC Servicio Integral SpA">
    <p>Si no lo tienes, nosotros te lo conseguimos.</p>
    <a href="https://wa.me/56922108234" target="_blank" rel="noopener">+56 9 2210 8234</a>
  </footer>

  <script src="../js/catalogo.js"></script>
</body>
</html>
